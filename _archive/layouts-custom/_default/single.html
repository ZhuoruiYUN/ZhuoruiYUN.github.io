{{ define "main" }}
  <article class="article">
    <p class="eyebrow">{{ .Section }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.tags }}
      <div class="tags article-tags">
        {{ range . }}<span>{{ . }}</span>{{ end }}
      </div>
    {{ end }}
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
