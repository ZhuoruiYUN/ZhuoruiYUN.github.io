baseURL = "https://example.com/"
locale = "en-us"
title = "Zhuorui Yun"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[build]
  writeStats = true

[languages]
  [languages.en]
    contentDir = "content"
    label = "English"
    weight = 1
    [languages.en.params]
      firstName = "Zhuorui"
      lastName = "Yun"
      name = "Zhuorui Yun"
      tagline = "Robotics. Control. Sim-to-real reinforcement learning."
      hero_description = "I build and study robotic systems across simulation, control, reinforcement learning, and hardware validation."
      hero_location = "Singapore"
      resume_url = "/files/Zhuorui_YUN_CV.pdf"
      collab_tags = ["Robotics", "Reinforcement Learning", "Control", "Aerial Systems"]

[params]
  firstName = "Zhuorui"
  lastName = "Yun"
  name = "Zhuorui Yun"
  email = "zhuoruiyun040926@gmail.com"
  profile_image = "/images/profile.jpg"
  author = "Zhuorui Yun"
  og_image = "/images/profile.jpg"
