  linkedin_url = "https://www.linkedin.com/in/zhuorui-yun-5675aa2b9/"
  linkedin_text = "linkedin.com/in/zhuorui-yun-5675aa2b9"
  github_url = "https://github.com/ZhuoruiYUN"
  github_text = "github.com/ZhuoruiYUN"
