  [[params.social]]
    icon = "github"
    url = "https://github.com/ZhuoruiYUN"

[menus]
  [[menus.main]]
    name = "About"
    url = "#about"
    weight = 10
  [[menus.main]]
    name = "Skills"
    url = "#skills"
    weight = 20
  [[menus.main]]
    name = "Experience"
    url = "#experience"
    weight = 30
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 40
  [[menus.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 50
  [[menus.main]]
    name = "Contact"
    url = "#contact"
    weight = 60

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']

[params.color_palettes]
  [[params.color_palettes.palette]]
    name = "robotics"
    main_color = "#1F4E5F"
    second_color = "#D1495B"
    third_color = "#2A9D8F"
  [[params.color_palettes.palette]]
    name = "lab"
    main_color = "#293241"
    second_color = "#EE6C4D"
    third_color = "#3D5A80"
  [[params.color_palettes.palette]]
    name = "field"
    main_color = "#31572C"
    second_color = "#BC6C25"
    third_color = "#277DA1"

[params.pexels]
  queries = ["robotics lab", "aerial drone", "engineering prototype"]
