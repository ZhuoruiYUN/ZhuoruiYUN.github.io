  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4E5F"/>
      <stop offset="0.55" stop-color="#2A9D8F"/>
      <stop offset="1" stop-color="#D1495B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
