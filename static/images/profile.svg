    <text x="400" y="438" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="178" font-weight="800" fill="#fff">ZY</text>
    <text x="400" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="rgba(255,255,255,0.84)">ROBOTICS</text>
